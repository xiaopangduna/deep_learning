[project]
name = "lovely-deep-learning"
version = "0.1.0"
description = ""
authors = [
    {name = "黄文华",email = "18675381281@163.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch==2.8.0+cu126",
    "torchvision==0.23.0+cu126",
    "torchaudio==2.8.0+cu126",
    "lightning (==2.5.5)",
    "ultralytics (==8.3.189)",
    "typer (==0.17.4)",
    "jupyter (>=1.1.1,<2.0.0)",
    "pandas (==2.2.3)",
    "seaborn (>=0.13.2,<0.14.0)",
    "jsonargparse[signatures] (>=4.46.0,<5.0.0)",
    "tensorboard (>=2.20.0,<3.0.0)",
    "torchmetrics (>=1.3.0,<2.0.0)",
    "pycocotools (>=2.0.8)",
    "onnx (==1.16.1)",
    "onnxruntime-gpu (==1.13.1)",
    "netron (>=9.0.1,<10.0.0)",
    "tensorrt-cu12 (==10.15.1.29)",
    "tensorrt-cu12-libs==10.15.1.29",
    "torch-pruning (>=1.6.1,<2.0.0)",
    "onnxslim (==0.1.65)"
]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lovely_deep_learning*"]
namespaces = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
tensorrt-cu12-libs = { index = "nvidia" }

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "PyYAML (>=6.0,<7.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "download: tests that download datasets",
    "cli: tests that run cli commands",
]