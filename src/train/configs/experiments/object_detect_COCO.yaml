# COCO 2017 目标检测实验：DAGNet(YOLOv8n) + DetectionLossYOLOv8（内部为 Ultralytics v8DetectionLoss）
# 用法（在 src/train 下）：
#   python scripts/train.py fit --config configs/experiments/object_detect_COCO.yaml
# 首次 fit 时 COCODataModule.prepare_data 解压数据并生成 CSV。
# 可将 coco2017labels.zip、train2017.zip、val2017.zip（及可选 test2017.zip）提前放入 datasets/COCO/，则跳过对应下载；解压后不删 zip。
# test2017 默认不自动下载，需手动放入 zip 或设 data.init_args.download_test2017: true

trainer:
  max_epochs: 500
  accelerator: auto
  accumulate_grad_batches: 4  # ObjectDetectModule 会把 backward loss ×4，抵消 Lightning 的 /acc，对齐官方求和
  callbacks:
    # 须排在 ModelCheckpoint 之前：val 期间模型上是 EMA，存盘与官方 best.pt 一致
    - class_path: lovely_deep_learning.callback.ema.ModelEMACallback
      init_args:
        decay: 0.9999
        tau: 2000
    - class_path: lovely_deep_learning.callback.object_detect.SaveObjectDetectTestPredictVisualizationCallback
      init_args:
        save_dir: tmp
        test_only_save_mistake: false
        conf_thres: 0.25
        match_iou_thres: 0.5
    - class_path: lovely_deep_learning.callback.object_detect.LogObjectDetectTrainValVisualizationCallback
      init_args:
        max_images: 4
        nrow: 2
        match_iou_thres: 0.5
    # - class_path: lightning.pytorch.callbacks.EarlyStopping
    #   init_args:
    #     monitor: "val_loss"
    #     min_delta: 0.0
    #     patience: 15
    #     verbose: true
    #     mode: min
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: "val_loss"
        filename: "{epoch:02d}-{val_loss:.4f}"
        save_top_k: 1
        save_last: true
        mode: min
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch   # 可选: "step" / "epoch" / null
        log_momentum: false      # 是否记录 momentum（一般不用）
        log_weight_decay: false  # 是否记录 weight decay

  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: logs
        name: object_detect_COCO_scratch
        version: null
  # profiler:
  #   class_path: lightning.pytorch.profilers.SimpleProfiler
  #   init_args:
  #     filename: profiler
  #     extended: true

data:
  class_path: lovely_deep_learning.data_module.coco.COCODataModule
  init_args:
    dataset_dir: datasets/COCO/coco
    train_csv_paths: [datasets/COCO/train.csv]
    val_csv_paths: [datasets/COCO/val.csv]
    test_csv_paths: [datasets/COCO/val.csv]
    predict_csv_paths: [datasets/COCO/predict.csv]
    key_map:
      img_path: path_img
      object_label_path: path_label_detect_yolo
    predict_key_map:
      img_path: path_img
    map_class_id_to_class_name: datasets/COCO/map_class_id_to_class_name.csv
    norm_mean: null
    norm_std: null
    batch_size: 16
    # WSL 约 8GB RAM：Mosaic 每样本读 4 张图，8 workers 在 train→val 切换时会被 OOM killer 杀掉
    num_workers: 2
    mosaic_prob: 1.0
    mosaic_size: 640
    transform_train:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
          # mosaic 已是 1280×1280：跳过 LetterBox，仿射在画布上做完再中心裁 640（对齐官方 mosaic border）
          - class_path: lovely_deep_learning.transforms.letterbox.LetterBox
            init_args:
              size: [640, 640]
              fill: 114
              center: true
              scaleup: true
              interpolation: 2
              skip_if_size: [1280, 1280]
          - class_path: torchvision.transforms.v2.RandomAffine
            init_args:
              degrees: [0.0, 0.0]
              # 0.05×1280 = 64px = 官方 translate 0.1×640；非 mosaic 的 640 图偏保守
              translate: [0.05, 0.05]
              scale: [0.5, 1.5]
              interpolation: 2
              fill: 114
          - class_path: torchvision.transforms.v2.CenterCrop
            init_args:
              size: [640, 640]
          - class_path: lovely_deep_learning.transforms.hsv.RandomHSV
            init_args:
              hgain: 0.015
              sgain: 0.7
              vgain: 0.4
          - class_path: torchvision.transforms.v2.RandomHorizontalFlip
            init_args:
              p: 0.5
          - class_path: torchvision.transforms.v2.ToDtype
            init_args:
              dtype: torch.float32
              scale: true
    transform_val:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
          - class_path: lovely_deep_learning.transforms.letterbox.LetterBox
            init_args:
              size: [640, 640]
              fill: 114
              center: true
              # True: match YOLO.val() (load_image upscales long side to 640, then pad)
              scaleup: true
              interpolation: 2
          - class_path: torchvision.transforms.v2.ToDtype
            init_args:
              dtype: torch.float32
              scale: true

model:
  class_path: lovely_deep_learning.module.object_detect.ObjectDetectModule
  init_args:
    # 训练集 mAP 默认关；COCO 全量每轮算一次会撑爆 WSL 内存。需要时改为 true
    log_train_metrics: false
    # 官方三组参数 + bias warmup（0.1→lr0）；线性衰减用模块内 LambdaLR，下面 SequentialLR 仅占位满足基类
    yolo_param_groups: true
    warmup_epochs: 3.0
    warmup_bias_lr: 0.1
    warmup_momentum: 0.8
    lrf: 0.01
    optimizer:
      class_path: torch.optim.SGD
      init_args:
        lr: 0.01
        momentum: 0.937
        nesterov: true
        weight_decay: 5.0e-4
    lr_scheduler:
      # yolo_param_groups: true 时 configure_optimizers 改用 LambdaLR（lrf），此项不生效
      class_path: torch.optim.lr_scheduler.SequentialLR
      init_args:
        schedulers:
          - class_path: torch.optim.lr_scheduler.LinearLR
            init_args:
              start_factor: 0.01
              end_factor: 1.0
              total_iters: 3
          # 衰减跨度须 ≈ max_epochs - warmup（500-3）。写成 7 会在约第 10 轮把 lr 打到 1e-4，后面几乎不学
          - class_path: torch.optim.lr_scheduler.LinearLR
            init_args:
              start_factor: 1.0
              end_factor: 0.01
              total_iters: 497
        milestones: [3]
    criterion:
      class_path: lovely_deep_learning.loss.object_detect.DetectionLossYOLOv8
      init_args:
        nc: 80
        reg_max: 16
        stride: [8, 16, 32]
        box_gain: 7.5
        cls_gain: 0.5
        dfl_gain: 1.5
        tal_topk: 10
    postprocess:
      class_path: lovely_deep_learning.postprocess.yolov8.YOLOv8PostProcessor
      init_args:
        nc: 80
        reg_max: 16
        stride: [8, 16, 32]
        max_det: 300
        nms: true
        nms_iou: 0.7
        inference_conf_thres: 0.001 # 0.25
        # 须与下方 metrics.init_args.box_format 一致（仅 preds；targets 由 metric 从 net_out 转换）
        map_pred_box_format: xyxy
    metrics:
      class_path: lovely_deep_learning.metric.object_detect.ObjectDetectMetric
      init_args:
        box_format: xyxy
        iou_type: bbox
    model:
      model_name: yolov8_n
      pretrained: false
      exporter:
        class_path: lovely_deep_learning.export.base.BaseExporter
        init_args:
          export_head:
            class_path: lovely_deep_learning.postprocess.yolov8.YOLOv8Decode
            init_args:
              nc: 80
              reg_max: 16
              stride: [8, 16, 32]
          onnx_cfg:
            input_shape: [1, 3, 640, 640]
            path_save_onnx: null
            simplify: true
            cfg_for_torch_onnx_export:
              export_params: true
              opset_version: 12
              input_names: ["images"]
              output_names: ["output0"]
          trt_cfg: {}
      # pretrained: false 时不加载；需要微调官方权重时改回 true 并取消注释
      # weight:
      #   map_location: cpu
      #   strict: false
      #   stages:
      #     - format: official
      #       path: pretrained_models/yolov8n.pt
      #       opts:
      #         url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.pt
      #         src_key_prefix: layers.
      #         src_key_slice_start: 12
      structure:
        inputs: [{name: input, shape: [3, 640, 640]}]
        outputs: [{name: detect, from: ["22"]}]
        layers:
          - name: "0"
            from: ["input"]
            module: lovely_deep_learning.nn.conv.Conv
            args: {c1: 3, c2: 16, k: 3, s: 2}
          - name: "1"
            from: ["0"]
            module: lovely_deep_learning.nn.conv.Conv
            args: {c1: 16, c2: 32, k: 3, s: 2}
          - name: "2"
            from: ["1"]
            module: lovely_deep_learning.nn.block.C2f
            args: {c1: 32, c2: 32, n: 1, shortcut: true}
          - name: "3"
            from: ["2"]
            module: lovely_deep_learning.nn.conv.Conv
            args: {c1: 32, c2: 64, k: 3, s: 2}
          - name: "4"
            from: ["3"]
            module: lovely_deep_learning.nn.block.C2f
            args: {c1: 64, c2: 64, n: 2, shortcut: true}
          - name: "5"
            from: ["4"]
            module: lovely_deep_learning.nn.conv.Conv
            args: {c1: 64, c2: 128, k: 3, s: 2}
          - name: "6"
            from: ["5"]
            module: lovely_deep_learning.nn.block.C2f
            args: {c1: 128, c2: 128, n: 2, shortcut: true}
          - name: "7"
            from: ["6"]
            module: lovely_deep_learning.nn.conv.Conv
            args: {c1: 128, c2: 256, k: 3, s: 2}
          - name: "8"
            from: ["7"]
            module: lovely_deep_learning.nn.block.C2f
            args: {c1: 256, c2: 256, n: 1, shortcut: true}
          - name: "9"
            from: ["8"]
            module: lovely_deep_learning.nn.block.SPPF
            args: {c1: 256, c2: 256, k: 5}
          - name: "10"
            from: ["9"]
            module: torch.nn.modules.upsampling.Upsample
            args: {size: null, scale_factor: 2, mode: nearest}
          - name: "11"
            from: ["10", "6"]
            module: ultralytics.nn.modules.conv.Concat
            args: {dimension: 1}
          - name: "12"
            from: ["11"]
            module: lovely_deep_learning.nn.block.C2f
            args: {c1: 384, c2: 128, n: 1}
          - name: "13"
            from: ["12"]
            module: torch.nn.modules.upsampling.Upsample
            args: {size: null, scale_factor: 2, mode: nearest}
          - name: "14"
            from: ["13", "4"]
            module: ultralytics.nn.modules.conv.Concat
            args: {dimension: 1}
          - name: "15"
            from: ["14"]
            module: lovely_deep_learning.nn.block.C2f
            args: {c1: 192, c2: 64, n: 1}
          - name: "16"
            from: ["15"]
            module: lovely_deep_learning.nn.conv.Conv
            args: {c1: 64, c2: 64, k: 3, s: 2}
          - name: "17"
            from: ["16", "12"]
            module: ultralytics.nn.modules.conv.Concat
            args: {dimension: 1}
          - name: "18"
            from: ["17"]
            module: lovely_deep_learning.nn.block.C2f
            args: {c1: 192, c2: 128, n: 1}
          - name: "19"
            from: ["18"]
            module: lovely_deep_learning.nn.conv.Conv
            args: {c1: 128, c2: 128, k: 3, s: 2}
          - name: "20"
            from: ["19", "9"]
            module: ultralytics.nn.modules.conv.Concat
            args: {dimension: 1}
          - name: "21"
            from: ["20"]
            module: lovely_deep_learning.nn.block.C2f
            args: {c1: 384, c2: 256, n: 1}
          - name: "22"
            from: ["15", "18", "21"]
            module: lovely_deep_learning.nn.head.Detect
            args: {nc: 80, ch: [64, 128, 256], legacy: true, stride: [8, 16, 32], shape: [136, 64, 80, 80]}
